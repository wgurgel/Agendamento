<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Agendamento - Sala de Vídeo</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 30px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #eee;
    }

    header h1 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    header p {
      color: #666;
      font-size: 1rem;
    }

    .booking-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #667eea;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 0.875rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #f8f9fa;
      font-weight: 600;
      color: #333;
    }

    tr:hover {
      background: #f5f5f5;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      display: inline-block;
    }

    .status-ocupado {
      background: #fee2e2;
      color: #dc2626;
    }

    .status-disponivel {
      background: #d1fae5;
      color: #059669;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: white;
      padding: 2rem;
      border-radius: 8px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .modal-message {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      color: #333;
    }

    .modal-close {
      padding: 0.5rem 2rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .modal-close:hover {
      background-color: #0056b3;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #666;
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .filter-section {
      margin-bottom: 20px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      header h1 {
        font-size: 1.5rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 0.875rem;
      }

      th, td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎥 Sistema de Agendamento - Sala de Vídeo</h1>
      <p>Reserve seu horário para utilização da sala de vídeo</p>
    </header>

    <section class="booking-section">
      <h2 class="section-title">📝 Novo Agendamento</h2>
      <form id="bookingForm">
        <div class="form-row">
          <div class="form-group">
            <label for="personName">Nome da Pessoa *</label>
            <input type="text" id="personName" placeholder="Digite seu nome completo" required>
          </div>
          
          <div class="form-group">
            <label for="bookingDate">Data *</label>
            <input type="date" id="bookingDate" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startTime">Hora de Início *</label>
            <input type="time" id="startTime" required>
          </div>

          <div class="form-group">
            <label for="endTime">Hora de Término *</label>
            <input type="time" id="endTime" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">✅ Realizar Agendamento</button>
      </form>
    </section>

    <section class="booking-section">
      <h2 class="section-title">📅 Agendamentos</h2>
      
      <div class="filter-section">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="filterDate">Filtrar por Data:</label>
          <input type="date" id="filterDate">
        </div>
      </div>

      <div id="bookingsContainer">
        <table id="bookingsTable">
          <thead>
            <tr>
              <th>Data</th>
              <th>Horário</th>
              <th>Nome</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <!-- Os agendamentos serão inseridos aqui -->
          </tbody>
        </table>
      </div>

      <div style="margin-top: 20px;">
        <button id="clearAllBtn" class="btn btn-danger btn-small">🗑️ Limpar Todos os Agendamentos</button>
      </div>
    </section>
  </div>

  <!-- Modal de Mensagens -->
  <div id="messageModal" class="modal">
    <div class="modal-content">
      <div class="modal-icon"></div>
      <div class="modal-message"></div>
      <button class="modal-close" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURAÇÃO DO FIREBASE
    // ============================================
    const firebaseConfig = {
      apiKey: "AIzaSyAnUrOq2H7-aLxgqT3DjKImG62GpSJr-AI",
      authDomain: "agendamento-sala-video.firebaseapp.com",
      projectId: "agendamento-sala-video",
      storageBucket: "agendamento-sala-video.firebasestorage.app",
      messagingSenderId: "531185790681",
      appId: "1:531185790681:web:d418e8ec37d8792b3918c8"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const COLLECTION_NAME = 'agendamentos';

    // ============================================
    // VARIÁVEIS GLOBAIS
    // ============================================
    let bookings = [];

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      loadBookings();
      setDefaultDate();
      setupEventListeners();
    });

    function setupEventListeners() {
      const bookingForm = document.getElementById('bookingForm');
      if (bookingForm) {
        bookingForm.addEventListener('submit', handleBookingSubmit);
      }

      const clearBtn = document.getElementById('clearAllBtn');
      if (clearBtn) {
        clearBtn.addEventListener('click', clearAllBookings);
      }

      const filterDate = document.getElementById('filterDate');
      if (filterDate) {
        filterDate.addEventListener('change', renderBookings);
      }
    }

    function setDefaultDate() {
      const today = new Date().toISOString().split('T')[0];
      const bookingDate = document.getElementById('bookingDate');
      const filterDate = document.getElementById('filterDate');
      
      if (bookingDate) bookingDate.value = today;
      if (filterDate) filterDate.value = today;
    }

    // ============================================
    // FUNÇÕES DO FIREBASE
    // ============================================
    function loadBookings() {
      db.collection(COLLECTION_NAME)
        .orderBy('date')
        .orderBy('startTime')
        .onSnapshot((snapshot) => {
          bookings = [];
          snapshot.forEach((doc) => {
            bookings.push({
              id: doc.id,
              ...doc.data()
            });
          });
          renderBookings();
          console.log('✅ Agendamentos carregados:', bookings.length);
        }, (error) => {
          console.error('❌ Erro ao carregar:', error);
          showModal('❌', 'Erro ao carregar agendamentos. Verifique o console.');
        });
    }

    async function addBooking(personName, date, startTime, endTime) {
      const booking = {
        personName: personName.trim(),
        date: date,
        startTime: startTime,
        endTime: endTime,
        status: 'Ocupado',
        createdAt: new Date().toISOString()
      };

      try {
        await db.collection(COLLECTION_NAME).add(booking);
        showModal('✅', 'Agendamento realizado com sucesso!');
      } catch (error) {
        console.error('❌ Erro ao salvar:', error);
        showModal('❌', 'Erro ao salvar agendamento.');
      }
    }

    async function cancelBooking(id) {
      if (confirm('Tem certeza que deseja cancelar este agendamento?')) {
        try {
          await db.collection(COLLECTION_NAME).doc(id).delete();
          showModal('🗑️', 'Agendamento cancelado com sucesso!');
        } catch (error) {
          console.error('❌ Erro ao cancelar:', error);
          showModal('❌', 'Erro ao cancelar agendamento.');
        }
      }
    }

    async function clearAllBookings() {
      if (confirm('⚠️ ATENÇÃO: Apagar TODOS os agendamentos?')) {
        if (confirm('Última chance. Deseja realmente apagar tudo?')) {
          try {
            const snapshot = await db.collection(COLLECTION_NAME).get();
            const batch = db.batch();
            snapshot.forEach((doc) => {
              batch.delete(doc.ref);
            });
            await batch.commit();
            showModal('🗑️', 'Todos os agendamentos foram removidos!');
          } catch (error) {
            console.error('❌ Erro ao limpar:', error);
            showModal('❌', 'Erro ao limpar agendamentos.');
          }
        }
      }
    }

    // ============================================
    // MANIPULAÇÃO DO FORMULÁRIO
    // ============================================
    function handleBookingSubmit(event) {
      event.preventDefault();

      const personName = document.getElementById('personName').value;
      const date = document.getElementById('bookingDate').value;
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;

      if (!personName || !date || !startTime || !endTime) {
        showModal('⚠️', 'Por favor, preencha todos os campos!');
        return;
      }

      if (startTime >= endTime) {
        showModal('⚠️', 'O horário de término deve ser maior que o horário de início!');
        return;
      }

      if (hasTimeConflict(date, startTime, endTime)) {
        showModal('⚠️', 'Já existe um agendamento neste horário!');
        return;
      }

      addBooking(personName, date, startTime, endTime);
      document.getElementById('bookingForm').reset();
      setDefaultDate();
    }

    function hasTimeConflict(date, startTime, endTime) {
      return bookings.some(booking => {
        if (booking.date !== date || booking.status !== 'Ocupado') {
          return false;
        }

        return (
          (startTime >= booking.startTime && startTime < booking.endTime) ||
          (endTime > booking.startTime && endTime <= booking.endTime) ||
          (startTime <= booking.startTime && endTime >= booking.endTime)
        );
      });
    }

    // ============================================
    // RENDERIZAÇÃO
    // ============================================
    function renderBookings() {
      const tableBody = document.querySelector('#bookingsTable tbody');
      if (!tableBody) return;

      tableBody.innerHTML = '';

      const filterDate = document.getElementById('filterDate');
      const selectedDate = filterDate ? filterDate.value : '';

      const filteredBookings = selectedDate
        ? bookings.filter(b => b.date === selectedDate)
        : bookings;

      if (filteredBookings.length === 0) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td colspan="5" style="text-align: center; padding: 2rem; color: #666;">
            Nenhum agendamento encontrado${selectedDate ? ' para esta data' : ''}.
          </td>
        `;
        tableBody.appendChild(row);
        return;
      }

      filteredBookings.sort((a, b) => a.startTime.localeCompare(b.startTime));

      filteredBookings.forEach(booking => {
        const row = createBookingRow(booking);
        tableBody.appendChild(row);
      });
    }

    function createBookingRow(booking) {
      const row = document.createElement('tr');

      const dateObj = new Date(booking.date + 'T00:00:00');
      const dateFormatted = dateObj.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });

      row.innerHTML = `
        <td>${dateFormatted}</td>
        <td>${formatTime(booking.startTime)} - ${formatTime(booking.endTime)}</td>
        <td>${escapeHtml(booking.personName)}</td>
        <td><span class="status-badge status-${booking.status.toLowerCase()}">${booking.status}</span></td>
        <td>
          <button onclick="cancelBooking('${booking.id}')" 
                  class="btn btn-danger btn-small" 
                  title="Cancelar agendamento">
            ️ Cancelar
          </button>
        </td>
      `;

      return row;
    }

    function formatTime(time) {
      return time.substring(0, 5);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============================================
    // MODAL
    // ============================================
    function showModal(icon, message) {
      const modal = document.getElementById('messageModal');
      if (!modal) return;

      modal.querySelector('.modal-icon').textContent = icon;
      modal.querySelector('.modal-message').textContent = message;
      modal.style.display = 'flex';

      setTimeout(() => {
        closeModal();
      }, 3000);
    }

    function closeModal() {
      const modal = document.getElementById('messageModal');
      if (modal) {
        modal.style.display = 'none';
      }
    }

    // Fechar modal ao clicar fora
    window.onclick = function(event) {
      const modal = document.getElementById('messageModal');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
