<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento da Sala de Vídeo - Escola Estadual Governador Walfredo Gurgel</title>
    <style>
        /* ============================================
           RESET E CONFIGURAÇÕES GLOBAIS
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --danger-gradient: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            --info-gradient: linear-gradient(135deg, #4e54c8 0%, #8f94fb 100%);
            --primary: #667eea;
            --primary-dark: #5568d3;
            --secondary: #764ba2;
            --accent: #f093fb;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --radius-sm: 0.375rem;
            --radius: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            background-attachment: fixed;
            color: var(--gray-700);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(240, 147, 251, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            background: var(--primary-gradient);
            color: var(--white);
            padding: 3rem 1.5rem;
            box-shadow: var(--shadow-lg);
            margin-bottom: 2.5rem;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .school-name {
            font-size: 2.2rem;
            margin-bottom: 0.75rem;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .page-title {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            opacity: 0.95;
        }

        .current-time {
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-full);
            display: inline-block;
            margin-top: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: 500;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 3rem;
            position: relative;
            z-index: 1;
        }

        .form-section,
        .filters-section,
        .bookings-section {
            background: var(--white);
            padding: 2.5rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            margin-bottom: 2.5rem;
            transition: var(--transition);
            border: 1px solid var(--gray-100);
            position: relative;
            overflow: hidden;
        }

        .form-section::before,
        .filters-section::before,
        .bookings-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-gradient);
        }

        .filters-section::before {
            background: var(--info-gradient);
        }

        .bookings-section::before {
            background: var(--success-gradient);
        }

        .section-title {
            color: var(--gray-800);
            font-size: 1.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid var(--gray-100);
            font-weight: 700;
        }

        .booking-form {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.75rem;
        }

        label {
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            padding: 0.875rem 1rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: var(--transition);
            font-family: inherit;
            background: var(--white);
            color: var(--gray-800);
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--gray-700);
            border: 2px solid var(--gray-200);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: var(--white);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: var(--white);
        }

        .btn-info {
            background: var(--info-gradient);
            color: var(--white);
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .filters-row {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .bookings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .booking-counter {
            background: var(--success-gradient);
            color: var(--white);
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-full);
            font-weight: 600;
        }

        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
        }

        .bookings-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
        }

        .bookings-table thead {
            background: var(--info-gradient);
            color: var(--white);
        }

        .bookings-table th {
            padding: 1.25rem 1rem;
            text-align: left;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .bookings-table td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--gray-100);
        }

        .bookings-table tbody tr:nth-child(even) {
            background: var(--gray-50);
        }

        .bookings-table tbody tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-occupied {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1.5rem;
            color: var(--gray-500);
            font-size: 1.1rem;
            display: none;
            background: var(--gray-50);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--gray-300);
        }

        .empty-state.show {
            display: block;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 3rem 2.5rem;
            max-width: 450px;
            width: 90%;
            box-shadow: var(--shadow-xl);
        }

        .modal-content {
            text-align: center;
        }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        .modal-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: var(--gray-700);
        }

        @media (max-width: 768px) {
            .school-name { font-size: 1.6rem; }
            .page-title { font-size: 1.3rem; }
            .form-row { grid-template-columns: 1fr; }
            .button-group { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img src="Logo EEGWG(2).png" alt="Logo da Escola" style="width:140px;height:auto;margin-bottom:1rem;">
            <h1 class="school-name">Escola Estadual Governador Walfredo Gurgel</h1>
            <h2 class="page-title">📅 Agendamento da Sala de Vídeo</h2>
            <div class="current-time" id="currentTime"></div>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h3 class="section-title">📝 Novo Agendamento</h3>
            <form id="bookingForm" class="booking-form">
                <div class="form-group">
                    <label for="personName">Nome do Professor (a):</label>
                    <input type="text" id="personName" placeholder="Digite o nome do professor (a)" required>
                </div>

                <div class="form-group">
                    <label for="bookingDate">Data:</label>
                    <input type="date" id="bookingDate" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="startTime">Horário de Início:</label>
                        <input type="time" id="startTime" required>
                    </div>

                    <div class="form-group">
                        <label for="endTime">Horário de Término:</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">✅ Agendar</button>
            </form>
        </section>

        <section class="filters-section">
            <h3 class="section-title">🔍 Filtros e Ações</h3>
            <div class="filters-row">
                <div class="form-group">
                    <label for="searchName">Pesquisar por professor(a):</label>
                    <input type="text" id="searchName" placeholder="Digite o nome do professor(a)...">
                </div>

                <div class="form-group">
                    <label for="filterDate">Filtrar por data:</label>
                    <input type="date" id="filterDate">
                </div>

                <div class="button-group">
                    <button id="btnToday" class="btn btn-secondary">📅 Hoje</button>
                    <button id="btnClearFilters" class="btn btn-secondary">🧹 Limpar Filtros</button>
                    <button id="btnExportCSV" class="btn btn-success">📊 Exportar CSV</button>
                    <button id="btnPrint" class="btn btn-info">🖨️ Imprimir/PDF</button>
                    <button id="btnClearAll" class="btn btn-danger">🗑️ Limpar Tudo</button>
                </div>
            </div>
        </section>

        <section class="bookings-section">
            <div class="bookings-header">
                <h3 class="section-title">📋 Agendamentos</h3>
                <div class="booking-counter" id="bookingCounter">0 agendamento(s)</div>
            </div>
            
            <div class="table-container">
                <table class="bookings-table" id="bookingsTable">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Horário Início</th>
                            <th>Horário Término</th>
                            <th>Professor(a)</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody"></tbody>
                </table>
            </div>

            <div class="empty-state" id="emptyState">
                <p>📭 Nenhum agendamento encontrado.</p>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="messageModal">
            <div class="modal-content">
                <div class="modal-icon" id="modalIcon"></div>
                <p class="modal-message" id="modalMessage"></p>
                <button class="btn btn-primary" id="modalClose">OK</button>
            </div>
        </div>
    </div>

    <script>
        let bookings = [];
        const STORAGE_KEY = 'salaVideoBookings';

        document.addEventListener('DOMContentLoaded', () => {
            loadBookings();
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            setDefaultDate();
            renderBookings();
            attachEventListeners();
        });

        function updateCurrentTime() {
            const now = new Date();
            const options = { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            };
            document.getElementById('currentTime').textContent = `🕐 ${now.toLocaleDateString('pt-BR', options)}`;
        }

        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('bookingDate').value = today;
            document.getElementById('filterDate').value = today;
        }

        function timeToMinutes(time) {
            const [hours, minutes] = time.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function formatDate(dateString) {
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function loadBookings() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) bookings = JSON.parse(stored);
        }

        function saveBookings() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
        }

        function checkTimeConflict(date, startTime, endTime, excludeId = null) {
            const newStart = timeToMinutes(startTime);
            const newEnd = timeToMinutes(endTime);
            return bookings.some(booking => {
                if (excludeId && booking.id === excludeId) return false;
                if (booking.date !== date) return false;
                const bookingStart = timeToMinutes(booking.startTime);
                const bookingEnd = timeToMinutes(booking.endTime);
                return (newStart < bookingEnd && newEnd > bookingStart);
            });
        }

        function validateForm(personName, date, startTime, endTime) {
            if (!personName.trim()) return { valid: false, message: 'Preencha o nome do professor(a).' };
            if (!date) return { valid: false, message: 'Selecione uma data.' };
            if (!startTime || !endTime) return { valid: false, message: 'Preencha os horários.' };
            if (timeToMinutes(endTime) <= timeToMinutes(startTime)) {
                return { valid: false, message: 'Horário de término deve ser posterior ao de início.' };
            }
            if (checkTimeConflict(date, startTime, endTime)) {
                return { valid: false, message: '⚠️ Este horário já está ocupado. Escolha outro.' };
            }
            return { valid: true };
        }

        function addBooking(personName, date, startTime, endTime) {
            bookings.push({
                id: generateId(),
                personName: personName.trim(),
                date, startTime, endTime,
                status: 'Ocupado',
                createdAt: new Date().toISOString()
            });
            saveBookings();
            renderBookings();
            showModal('✅', 'Agendamento realizado com sucesso!');
        }

        function cancelBooking(id) {
            if (confirm('Tem certeza que deseja cancelar este agendamento?')) {
                bookings = bookings.filter(b => b.id !== id);
                saveBookings();
                renderBookings();
                showModal('🗑️', 'Agendamento cancelado!');
            }
        }

        function clearAllBookings() {
            if (confirm('⚠️ Apagar TODOS os agendamentos? Esta ação não pode ser desfeita!')) {
                if (confirm('Última chance! Deseja realmente apagar tudo?')) {
                    bookings = [];
                    saveBookings();
                    renderBookings();
                    showModal('🗑️', 'Todos os agendamentos foram removidos!');
                }
            }
        }

        function renderBookings() {
            const searchName = document.getElementById('searchName').value.toLowerCase();
            const filterDate = document.getElementById('filterDate').value;
            
            let filtered = bookings.filter(b => {
                const matchName = b.personName.toLowerCase().includes(searchName);
                const matchDate = !filterDate || b.date === filterDate;
                return matchName && matchDate;
            });

            filtered.sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
            });

            document.getElementById('bookingCounter').textContent = `${filtered.length} agendamento(s)`;

            const tbody = document.getElementById('bookingsBody');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.add('show');
            } else {
                emptyState.classList.remove('show');
                tbody.innerHTML = filtered.map(b => `
                    <tr>
                        <td>${formatDate(b.date)}</td>
                        <td>${b.startTime}</td>
                        <td>${b.endTime}</td>
                        <td>${b.personName}</td>
                        <td><span class="status-badge status-occupied">${b.status}</span></td>
                        <td><button class="btn btn-danger btn-small" onclick="cancelBooking('${b.id}')">❌ Cancelar</button></td>
                    </tr>
                `).join('');
            }
        }

        function exportToCSV() {
            if (bookings.length === 0) {
                showModal('⚠️', 'Não há agendamentos para exportar!');
                return;
            }
            let csv = 'Data,Hora Início,Hora Término,Professor(a),Status\n';
            bookings.forEach(b => {
                csv += `${formatDate(b.date)},${b.startTime},${b.endTime},"${b.personName}",${b.status}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', `agendamentos_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showModal('✅', 'Arquivo CSV exportado!');
        }

        function showModal(icon, message) {
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function attachEventListeners() {
            document.getElementById('bookingForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const personName = document.getElementById('personName').value;
                const date = document.getElementById('bookingDate').value;
                const startTime = document.getElementById('startTime').value;
                const endTime = document.getElementById('endTime').value;
                const validation = validateForm(personName, date, startTime, endTime);
                if (validation.valid) {
                    addBooking(personName, date, startTime, endTime);
                    e.target.reset();
                    setDefaultDate();
                } else {
                    showModal('⚠️', validation.message);
                }
            });

            document.getElementById('searchName').addEventListener('input', renderBookings);
            document.getElementById('filterDate').addEventListener('change', renderBookings);

            document.getElementById('btnToday').addEventListener('click', () => {
                document.getElementById('filterDate').value = new Date().toISOString().split('T')[0];
                renderBookings();
            });

            document.getElementById('btnClearFilters').addEventListener('click', () => {
                document.getElementById('searchName').value = '';
                document.getElementById('filterDate').value = '';
                renderBookings();
            });

            document.getElementById('btnExportCSV').addEventListener('click', exportToCSV);
            document.getElementById('btnPrint').addEventListener('click', () => window.print());
            document.getElementById('btnClearAll').addEventListener('click', clearAllBookings);
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeModal();
            });
        }
    </script>
    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- Configuração do Firebase -->
<script src="firebase-config.js"></script>
</body>
</html>
